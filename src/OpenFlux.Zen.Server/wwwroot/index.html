<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OpenFlux Zen Server</title><style>body{font:15px system-ui;background:#101827;color:#e5e7eb;margin:0}main{max-width:1100px;margin:auto;padding:24px}.card{background:#182338;border:1px solid #293957;border-radius:10px;padding:16px;margin:12px 0}button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:8px 12px;margin:2px}input{background:#0f172a;color:#fff;border:1px solid #334155;padding:8px}</style><main><h1>OpenFlux Zen Server</h1><section id="login" class="card"><input id="user" placeholder="Логин"><input id="pass" type="password" placeholder="Пароль"><button onclick="login()">Войти</button><p id="err"></p></section><section id="app" hidden><div class="card">Туннелей: <b id="total">0</b> · Активных: <b id="active">0</b> · Трафик: <b id="traffic">0 B</b></div><div class="card"><button onclick="newTunnel()">Добавить туннель</button><div id="tunnels"></div></div></section></main><script>let token=localStorage.token;const api=(u,o={})=>fetch(u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(token||'')}});async function login(){let s=await(await fetch('/api/settings')).json();if(user.value!==s.username){err.textContent='Неверные данные';return}token=pass.value;localStorage.token=token;show()}function logout(){localStorage.removeItem('token');location.reload()}function fmt(n){return n<1024?n+' B':(n/1024).toFixed(1)+' KB'}async function show(){login.hidden=true;app.hidden=false;let ts=await(await api('/api/tunnels')).json();total.textContent=ts.length;active.textContent=ts.filter(x=>x.status==3).length;traffic.textContent=fmt(ts.reduce((a,x)=>a+x.uploadBytes+x.downloadBytes,0));tunnels.innerHTML=ts.map(t=>'<div class="card"><b>'+ (t.name||'Без имени')+'</b> · '+t.role+'/'+t.transport+'<br><button onclick="act(\''+t.id+'\',\'start\')">Запустить</button><button onclick="act(\''+t.id+'\',\'stop\')">Остановить</button><button onclick="del(\''+t.id+'\')">Удалить</button></div>').join('')}async function act(id,a){await api('/api/tunnels/'+id+'/'+a,{method:'POST'});show()}async function del(id){await api('/api/tunnels/'+id,{method:'DELETE'});show()}async function newTunnel(){let name=prompt('Имя туннеля','Tunnel-'+Date.now());if(name)await api('/api/tunnels',{method:'POST',body:JSON.stringify({name,role:'client',inbound:'socks5',transport:'yandex',mode:'l4',socksAddress:':1080',enabled:false})});show()}if(token)show();</script>
