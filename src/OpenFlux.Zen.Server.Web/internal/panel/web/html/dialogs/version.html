  <!-- Rollback / Switch Version Modal -->
  <div id="rollback-modal" class="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rollback-modal-title">
      <div class="modal-header">
        <h4 class="modal-title" id="rollback-modal-title" data-i18n="modal_rollback_title">Смена версии</h4>
        <button class="modal-close" aria-label="Закрыть" onclick="closeRollbackModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body rollback-modal-body">
        <p id="rollback-modal-desc" class="rollback-desc"></p>
        
        <div class="form-group rollback-form-group">
          <label id="rollback-select-label" for="rollback-version-select" class="rollback-label" data-i18n="modal_rollback_select_label">Выберите версию для установки:</label>
          <select id="rollback-version-select" class="form-control" onchange="onRollbackVersionChange()">
            <option value="">Загрузка списка версий с GitHub...</option>
          </select>
        </div>
      </div>
      <div class="modal-footer rollback-modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeRollbackModal()" data-i18n="btn_cancel">Отмена</button>
        <button type="button" id="btn-submit-rollback" class="btn btn-primary" onclick="submitRollback()">
          <span id="btn-rollback-spinner" style="display: none;" class="spinner-inline"></span>
          <span id="btn-submit-rollback-text" data-i18n="btn_apply_version">Установить версию</span>
        </button>
      </div>
    </div>
  </div>
