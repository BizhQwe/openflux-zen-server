    <!-- Login View -->
    <div id="login-view" class="login-container">
      <div class="login-brand">
        <img src="images/logo-192x192.png?v=1.1.2" class="login-logo" alt="OpenFlux Logo" />
        <div class="login-brand-copy">
          <div class="brand-title login-brand-title"><span>OpenFlux</span><span class="brand-accent">Zen</span></div>
          <span class="brand-badge">Server</span>
        </div>
      </div>
      <p class="login-sub" data-i18n="login_sub">Войдите в панель управления туннелями</p>


      <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
        <div class="form-group" style="text-align: left;">
          <label for="login-user" data-i18n="login_user_label">Имя пользователя</label>
          <input type="text" id="login-user" autocomplete="username" class="form-control" data-i18n-placeholder="login_user_placeholder" placeholder="Имя пользователя" required autofocus />
        </div>
        <div class="form-group" style="text-align: left;">
          <label for="login-pass" data-i18n="login_pass_label">Пароль</label>
          <input type="password" id="login-pass" autocomplete="current-password" class="form-control" placeholder="••••••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" data-i18n="login_btn">Войти в панель</button>
      </form>
    </div>
