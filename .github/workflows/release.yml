name: Build & Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build All Cross-Platform Installers
        shell: pwsh
        run: |
          ./scripts/build-installers.ps1 -Targets @("win-x64", "win-arm64", "linux-x64", "linux-arm64")

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/openflux-installer-win-x64.exe
            dist/openflux-installer-win-arm64.exe
            dist/openflux-installer-linux-x64
            dist/openflux-installer-linux-arm64
            dist/openflux-zen-server-win-x64.zip
            dist/openflux-zen-server-win-arm64.zip
            dist/openflux-zen-server-linux-x64.zip
            dist/openflux-zen-server-linux-arm64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
