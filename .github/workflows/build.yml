name: Build OpenFlux Zen Server

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CGO_ENABLED: '0'

jobs:
  checks:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      OPENFLUX_TEST_REQUIRE_PHP: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache-dependency-path: src/**/go.sum
      - name: Set up PHP for integration tests
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: openssl
          coverage: none
          tools: none
      - name: Check test runtimes
        run: |
          go version
          php --version
          php -r 'if (!extension_loaded("openssl")) { fwrite(STDERR, "PHP OpenSSL is required\n"); exit(1); }'
      - name: Test core, web, installer and CLI
        run: >-
          go test -p 2 -timeout 5m -count=1
          ./src/OpenFlux.Zen.Server.Core/...
          ./src/OpenFlux.Zen.Server.Web/...
          ./src/OpenFlux.Zen.Server.Installer/...
          ./src/OpenFlux.Zen.Server.Cli/...
      - name: Test network placement UI
        run: node --test scripts/tests/network-placement.test.cjs
      - name: Vet
        run: >-
          go vet
          ./src/OpenFlux.Zen.Server.Core/...
          ./src/OpenFlux.Zen.Server.Web/...
          ./src/OpenFlux.Zen.Server.Installer/...
          ./src/OpenFlux.Zen.Server.Cli/...

  build:
    name: Build (${{ matrix.target }})
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows-amd64
          - windows-arm64
          - windows-386
          - linux-amd64
          - linux-arm64
          - linux-386
          - linux-armv7
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache-dependency-path: src/**/go.sum
      - name: Build single-file installer
        run: sh scripts/build.sh "$TARGET"
      - name: Verify installer checksum
        shell: bash
        run: |
          suffix=''
          if [[ "$TARGET" == windows-* ]]; then suffix='.exe'; fi
          asset="openflux-zen-server-installer-$TARGET$suffix"
          cd dist
          test -s "$asset"
          test -s "$asset.sha256"
          sha256sum --check "$asset.sha256"
          if [[ "$TARGET" == linux-amd64 ]]; then "./$asset" --verify; fi
      - name: Upload installer and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/openflux-zen-server-installer-${{ matrix.target }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download all installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - name: Prepare and verify release files
        run: sh scripts/package-release.sh --skip-build release
      - name: Publish installers, bootstrap scripts and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/openflux-release-info.json"; then
            is_draft=$(jq -r '.isDraft' "$RUNNER_TEMP/openflux-release-info.json")
            asset_count=$(jq -r '.assets | length' "$RUNNER_TEMP/openflux-release-info.json")
            if [[ "$is_draft" != "true" && "$asset_count" -gt 0 ]]; then
              echo "Release $RELEASE_TAG is already published with $asset_count assets. Existing assets are preserved."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "OpenFlux Zen Server $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"
